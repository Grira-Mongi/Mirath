<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أصحاب الفروض من الرجال والنساء</title>
<style>
:root{--bg:#f6f8fc;--fg:#1b2430;--card:#fff;--line:#9db4d8;--blue:#b8dcff;--blue2:#4a90e2;--ph:#c9ccd1;--accent:#8b1e2d;--mut:#667085;--nav:#1f3a5f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--fg:#e8ecf2;--card:#1a212c;--line:#3b5b8c;--blue:#24466f;--blue2:#7db5f5;--ph:#3a414c;--accent:#ff8a98;--mut:#9aa4b2;--nav:#2a4a78}}
:root[data-theme="dark"]{--bg:#10151c;--fg:#e8ecf2;--card:#1a212c;--line:#3b5b8c;--blue:#24466f;--blue2:#7db5f5;--ph:#3a414c;--accent:#ff8a98;--mut:#9aa4b2;--nav:#2a4a78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif;line-height:1.7;min-height:100vh}
#app{max-width:560px;margin:auto;padding:14px 14px 40px;text-align:center}
h1{font-size:1.25rem;color:var(--accent);margin:8px 0 18px}
h2{font-size:1.05rem;margin:6px 0 14px}
.back{display:block;text-align:right;background:none;border:0;color:var(--blue2);font:inherit;font-size:.95rem;padding:4px 0;cursor:pointer}
.big{display:block;width:100%;margin:12px 0;padding:18px 10px;font:inherit;font-size:1.15rem;font-weight:700;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:16px;cursor:pointer}
.big:active,.ic:active,.num:active,.dq:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ic{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 6px;font:inherit;color:var(--fg);cursor:pointer}
.ic .e{font-size:2.6rem;line-height:1.2;display:block}
.ic .t{font-weight:700;font-size:.95rem}
.ph{width:130px;height:130px;margin:6px auto 14px;background:var(--ph);border-radius:20px;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;font-size:3.6rem}
.nm{display:inline-block;min-width:150px;padding:4px 18px;background:var(--card);border:1.5px solid var(--fg);font-size:.95rem}
.cnt{margin:18px 0;padding:14px 8px;background:var(--card);border:2.5px solid var(--fg);font-size:1.4rem;font-weight:700}
.nums{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:14px}
.num{width:62px;height:62px;border-radius:50%;background:var(--blue);border:3px solid var(--blue2);font:700 1.5rem/1 Arial,Helvetica,sans-serif;color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:2px 0 0;margin:0;flex:none}
.num.big1{width:78px;height:78px;font-size:1.9rem;cursor:default;margin:12px auto}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;margin:14px 0;text-align:right}
.row .num{width:40px;height:40px;font-size:1.15rem;cursor:default;border-width:2px}
.row .f{flex:none;min-width:70px;align-self:stretch;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);border-inline:1px solid var(--line);padding:0 8px}
.row .w{flex:1;font-size:.95rem}
.fw{display:inline-flex;align-items:center;gap:5px}.fs{font-size:.8rem;white-space:nowrap}.fr{display:inline-flex;flex-direction:column;align-items:center;font:700 1.15rem/1.25 Arial,sans-serif;direction:ltr}.fr b{display:block;min-width:1.4em;text-align:center;font-weight:700}
.fr b:first-child{border-bottom:2px solid var(--accent)}
.ft{font-size:1.05rem}
.dq{display:inline-block;margin-top:10px;padding:9px 16px;font:inherit;font-size:.95rem;color:var(--blue2);background:none;border:1.5px dashed var(--blue2);border-radius:12px;cursor:pointer}
.dl{margin-top:14px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.dl .a{font-size:1.1rem;line-height:2;margin-top:10px}.dl .a:first-of-type{margin-top:0}.dl .s{border-bottom:1px dashed var(--line);padding-bottom:8px}.dl .s:last-child{border:0;padding:0}
.dl .s{color:var(--mut);font-size:.82rem;margin-top:4px}
.dl .l{color:var(--accent);font-size:.85rem;margin-bottom:4px}
.nv{display:flex;gap:8px;justify-content:center;margin-top:16px}
.nv button{font:inherit;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.dl .a{font-size:1rem;line-height:1.9;text-align:right;font-weight:600}.dl .a p{margin:0 0 8px}.dl .a p:last-child{margin:0}.bk{display:inline-block;width:4em}.sig{max-width:560px;margin:8px auto 0;padding:12px 14px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:700;font-size:.95rem;color:var(--accent);border-top:1px solid var(--line)}.row .f{flex-wrap:wrap;text-align:center}.ft{font-size:.9rem;text-align:center;line-height:1.4}.nm{max-width:100%}.ic .t{display:block;margin-top:2px}
</style>
</head>

var G={"m": [{"n": "الأب", "e": "👨", "c": [["1/6", "فرضاً مع الفرع الوارث المذكر الابن وابن الابن مهما نزل", "لقوله تعالى: ولأبويه لكل واحد منهما السدس مما ترك إن كان له ولد", ""], ["1/6 + ع", "مع الفرع الوارث المؤنث البنت وبنت الابن مهما نزل أبوها", "ولأبويه لكل واحد منهما السدس مما ترك إن كان له ولد + حديث ابن عباس (الحقوا الفرائض بأهلها فما بقي فهو لأولى رجل ذكر )", ""], ["ع", "عند عدم وجود فرع وارث مطلقاً", "فإن لم يكن له ولد وورثه أبواه فلأمه الثلث (فالباقي للأب عُصْبَةٌ) +حديث ابن عباس", ""]]}, {"n": "الجدّ الصحيح (أب الأب)", "e": "👴", "c": [["1/6", "فرضاً مع الفرع الوارث المذكر الابن وابن الابن مهما نزل", "<p>لخطاب الله عز وجل لنا في القرآن بابني آدم كما ورد قول سيدنا يوسف (واتبعت ملة آبائي إبراهيم و إسحاق ويعقوب)</p><p>لقوله تعالى: (ولأبويه لكل واحد منهما السدس مما ترك إن كان له ولد)</p>", ""], ["1/6 + ع", "مع الفرع الوارث المؤنث البنت وبنت الابن مهما نزل أبوها", "<p>لخطاب الله عز وجل لنا في القرآن بابني آدم كما ورد قول سيدنا يوسف (واتبعت ملة آبائي إبراهيم و إسحاق ويعقوب)</p><p>لقوله تعالى: ولأبويه لكل واحد منهما السدس مما ترك  إن كان له ولد + حديث ابن عباس (الحقوا الفرائض بأهلها فما بقي فهو لأولى رجل ذكر)</p>", ""], ["ع", "عند عدم وجود فرع وارث مطلقاً", "<p>لخطاب الله عز وجل لنا في القرآن بابني آدم كما ورد قول سيدنا يوسف (واتبعت ملة آبائي إبراهيم و إسحاق ويعقوب)</p><p>ولأبويه لكل واحد منهما السدس مما ترك  إن كان له ولد و حديث ابن عباس (الحقوا الفرائض بأهلها فما بقي فهو لأولى رجل ذكر)</p>", ""], ["الحجب", "يحجب الجد بالأب", "القاعدة (من أدلى إلى الميت بواسطة حجبته)", "h"], ["الحجب", "الجد القريب يحجب الجد البعيد", "القاعدة (من أدلى إلى الميت بواسطة حجبته)", "h"]]}, {"n": "الزوج", "e": "🤵", "c": [["1/2", "فرضاً عند عدم وجود الفرع الوارث مطلقاً للزوجة منه أو من غيره", "لقوله تعالى: (ولكم نصف ما ترك أزواجكم إن لم يكن لهن ولد", ""], ["1/4", "فرضاً عند وجود الفرع الوارث مطلقاً للزوجة منه أو من غيره", "فإن كان لهن ولد فلكم الربع مما تركن )", ""]]}, {"n": "الأخوة و الأخوات لأم", "e": "🧑‍🤝‍🧑", "c": [["1/6", "فرضاً إذا كان واحداً وغير محجوب", "لقوله تعالى: (وإن كان ر
