<title>أصحاب الفروض من الرجال و النساء</title>

<style>

html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ic{display:flex;flex-direction:column;align-items:center;background:var(--paper);border:2px solid var(--gold2);border-radius:26px 26px 14px 14px;padding:10px 6px 8px;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 3px 10px rgba(120,100,50,.12)}
